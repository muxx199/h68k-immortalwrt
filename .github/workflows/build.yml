name: Build ImmortalWrt for HINLINK H68K

on:
  workflow_dispatch:
    inputs:
      iw_branch:
        description: "ImmortalWrt 分支 (默认 master)"
        required: false
        default: "master"
        type: choice
        options:
          - master
          - 24.10
      upload_packages:
        description: "连同全部软件包打包上传（体积大）"
        required: false
        default: false
        type: boolean

env:
  IW_REPO: immortalwrt/immortalwrt
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: rockchip/armv8 -> hinlink_h68k
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    defaults:
      run:
        working-directory: openwrt

    steps:
      - name: 释放 runner 磁盘空间
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker system prune -a -f
          df -h

      - name: 拉取 ImmortalWrt 源码
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IW_REPO }}
          ref: ${{ inputs.iw_branch || 'master' }}
          path: openwrt
          fetch-depth: 1

      - name: 拉取本定制仓库
        uses: actions/checkout@v4
        with:
          path: h68k-custom
          fetch-depth: 1

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-pyelftools \
            python3-setuptools rsync swig unzip zlib1g-dev file wget tzdata \
            cmake device-tree-compiler libelf-dev ccache

      - name: 配置下载加速（dl镜像 + GitHub代理）
        run: |
          # OpenWrt dl源替换为中科大镜像
          sed -i 's#https://downloads.openwrt.org#https://mirrors.ustc.edu.cn/openwrt#g' feeds.conf.default
          sed -i 's#https://sources.openwrt.org#https://mirrors.ustc.edu.cn/openwrt/sources#g' feeds.conf.default
          # GitHub clone代理
          git config --global url."https://mirror.ghproxy.com/https://github.com/".insteadOf "https://github.com/"

      - name: 移植 HINLINK H68K 补丁
        run: |
          python3 ../h68k-custom/scripts/patch_hinlink.py .
          cp ../h68k-custom/patches/106-board-rockchip-add-HINLINK-H66K-H68K.patch package/boot/uboot-rockchip/patches/
          ls -la package/boot/uboot-rockchip/patches/ | tail -n 5

      - name: 接入第三方插件：iStore / Lucky / Argon主题
        run: |
          # Lucky
          git clone --depth=1 https://github.com/sirpdboy/luci-app-lucky.git /tmp/lucky
          mkdir -p package/lucky/luci-app-lucky package/lucky/lucky
          cp -r /tmp/lucky/luci-app-lucky/. package/lucky/luci-app-lucky/
          cp -r /tmp/lucky/lucky/. package/lucky/lucky/
          rm -rf /tmp/lucky

          # iStore
          git clone --depth=1 https://github.com/linkease/istore.git /tmp/istore
          mkdir -p package/istore
          cp -r /tmp/istore/luci/. package/istore/
          rm -rf /tmp/istore
          if [ -f package/istore/luci-app-store/Makefile ]; then
            sed -i 's/^LUCI_EXTRA_DEPENDS:=luci-lib-taskd (>=1.0.19)/LUCI_EXTRA_DEPENDS:=luci-lib-taskd/' package/istore/luci-app-store/Makefile
          fi

          # Argon主题 + 设置面板
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config

          # USB打印机内核支持
          if grep -q '^CONFIG_USB_PRINTER=y' target/linux/rockchip/config-6.18; then
            sed -i 's/^CONFIG_USB_PRINTER=y/CONFIG_USB_PRINTER=y/' target/linux/rockchip/config-6.18
          else
            echo 'CONFIG_USB_PRINTER=y' >> target/linux/rockchip/config-6.18
          fi

      - name: 更新并安装 feeds
        run: |
          grep -q '^src-git packages' feeds.conf.default || exit 1
          grep -q '^src-git luci' feeds.conf.default || exit 1
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          grep -l 'Package: luci-app-store' package/istore/*/Makefile && echo '[LOCAL-OK] luci-app-store' || echo '[LOCAL-MISS] luci-app-store'

      - name: 部署定制配置 + 预置中文包、Argon主题
        run: |
          cp ../h68k-custom/config/hinlink_h68k.config .config
          make defconfig
          # 移除冲突的H66K配置
          if grep -q 'CONFIG_TARGET_rockchip_DEVICE_hinlink_h66k=y' .config; then
            sed -i '/CONFIG_TARGET_rockchip_DEVICE_hinlink_h66k=y/d' .config
            make defconfig
          fi
          # 加入中文语言包
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y' >> .config
          # 打包Argon主题和设置面板
          echo 'CONFIG_PACKAGE_luci-theme-argon=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-argon-config=y' >> .config
          make defconfig
          echo "::group::.config 关键信息"
          grep -E 'hinlink|argon|zh-cn|lucky|istore|USB_PRINTER' .config || true
          echo "::endgroup::"

          python3 ../h68k-custom/scripts/validate_config.py || {
            echo "::group::CONFIG诊断"
            grep -E 'lucky|istore|argon|zh-cn' .config | head -120 || true
            echo "::endgroup::"
            echo "::group::iStore检查"
            grep -n 'luci-app-store' tmp/.config-package.in || echo '[STORE-MISS] 未识别'
            make package/istore/luci-app-store/clean compile -j1 V=sc > store-build.log 2>&1; echo "exit=$?"
            tail -n 40 store-build.log
            echo "::endgroup::"
            exit 1
          }

      - name: 下载源码并预编译工具链
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \; || true
          make -j$(($(nproc)-1)) V=sc tools/compile toolchain/compile > build-env.log 2>&1
          rc=$?
          tail -n 20 build-env.log
          exit $rc

      - name: 编译固件
        id: compile
        run: |
          make -j$(($(nproc)-1)) > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo '=== 编译失败，单独编译uboot-rockchip排查 ==='
            make package/boot/uboot-rockchip/clean compile -j1 V=sc >> build.log 2>&1 || true
            tail -n 60 build.log
          fi
          echo "make exit=$rc"
          tail -n 25 build.log
          exit $rc
        continue-on-error: true

      - name: 编译失败日志摘要
        if: steps.compile.outcome == 'failure'
        run: |
          echo "::group::最后150行编译日志"
          tail -n 150 build.log
          echo "::endgroup::"
          echo "编译失败，请核对日志"
          exit 1

      - name: 打包产物
        if: steps.compile.outcome == 'success'
        run: |
          mkdir -p out
          find bin/targets/rockchip/armv8 -maxdepth 2 -name '*sysupgrade*.img*' -exec cp {} out/ \;
          [ -f bin/targets/rockchip/armv8/sha256sums ] && cp bin/targets/rockchip/armv8/sha256sums out/ || true
          cp .config out/config.seed
          (cd out && sha256sum *.img* > images.sha256)
          ls -lh out
          if [ "${{ inputs.upload_packages }}" = "true" ]; then
            tar -czf out/packages-full.tar.gz -C bin .
          fi

      - name: 上传固件
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-h68k-${{ github.run_number }}
          path: openwrt/out/
          retention-days: 7

      - name: 写入汇总信息
        if: steps.compile.outcome == 'success'
        run: |
          {
            echo "## ImmortalWrt H68K 编译完成"
            echo ""
            echo "下载产物：immortalwrt-h68k-${{ github.run_number }}"
            echo ""
            echo "### 内置内容"
            echo "- Argon主题 + Argon设置面板（默认主题）"
            echo "- 简体中文语言包"
            echo "- Lucky + iStore"
            echo "- USB打印机支持"
            echo ""
            echo "### 访问信息"
            echo "- 地址：http://192.168.1.1"
            echo "- 用户：root，默认无密码"
          } >> $GITHUB_STEP_SUMMARY
